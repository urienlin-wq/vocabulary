workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate missing platform files
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=word_memorizer .
          fi
      - name: Restore main.dart if overwritten
        script: |
          if grep -q "dot-shorthands|MyHomePage|counter" lib/main.dart 2>/dev/null; then
            echo "main.dart was overwritten, this needs manual fix"
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
