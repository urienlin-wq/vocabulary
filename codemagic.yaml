workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project and restore our code
        script: |
          # 1. 补齐缺失的 android 底层工程
          flutter create --platforms=android --project-name=word_memorizer .
          # 2. 强制还原 lib 目录和配置文件，把被篡改的 main.dart 彻底恢复成我们自己的代码
          git checkout HEAD -- lib/ pubspec.yaml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
