name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Backup existing files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak

      - name: Generate missing platform files
        run: flutter create --platforms=android --org com.example.vocabulary .

      - name: Restore pubspec and lib
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r lib.bak lib
          rm pubspec.yaml.bak
          rm -rf lib.bak

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
